[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers -m "not llm"
markers =
    artifacts: requires the trained model artifacts in models/
    dataset: requires datasets/cicids2017_cleaned.parquet
    llm: calls a real LLM provider; deselected by default via addopts.
         Opt in with: pytest -m llm  AND  IDS_LLM_INTEGRATION=1
    report: requires reports/evaluation_random_vs_temporal.json
