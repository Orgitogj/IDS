protocol_version: live-lab-v1
experiment_id: lab-generalization-v1
run_id: lab-v1-ftp-bruteforce-001
scenario_id: ftp-bruteforce
scenario_description: >-
  Credential brute force from Kali against the Metasploitable2 vsftpd service on port
  21, driven by a wordlist. Parallel to the SSH run and mapped to the same family, which
  lets the two be compared without changing the ground-truth strategy.

expected_binary_label: ATTACK
expected_family: Brute Force
planned_duration_seconds: 900

ground_truth:
  mode: per_flow_selector
  unmatched_policy: UNLABELLED
  attack_selector:
    source_ip: 192.168.50.10
    destination_ip: 192.168.50.20
    destination_ports: [21]
  rationale: >-
    Only flows to the FTP control port from the attacking host are brute-force traffic.

topology:
  source_host: 192.168.50.10
  source_role: kali
  target_host: 192.168.50.20
  target_role: metasploitable2
  network: isolated host-only laboratory segment, no route to the internet

capture:
  interface: eth0
  source: cicflowmeter
  timestamp_column: timestamp
  timestamp_timezone: America/New_York
  timestamp_assumed_utc: false

model:
  name: xgb-baseline-cicids2017-v2
  version: "2.0"
  feature_version: cicids2017-78-v1
  artifact_file: xgb_baseline_cicids2017_v2.joblib

notes: >-
  FTP data-channel flows on ephemeral ports are not captured by the selector and stay
  UNLABELLED, which is the intended conservative behaviour. Required service: vsftpd
  on 21.
