protocol_version: live-lab-v1
experiment_id: lab-generalization-v1
run_id: lab-v1-ssh-bruteforce-001
scenario_id: ssh-bruteforce
scenario_description: >-
  Credential brute force from Kali against the Metasploitable2 OpenSSH service on port
  22, driven by a wordlist. CICIDS2017 produced its SSH-Patator class with a different
  tool but the same behaviour class, so the mapping is declared at family level only.

expected_binary_label: ATTACK
expected_family: Brute Force
planned_duration_seconds: 900

ground_truth:
  mode: per_flow_selector
  unmatched_policy: UNLABELLED
  attack_selector:
    source_ip: 192.168.50.10
    destination_ip: 192.168.50.20
    destination_ports: [22]
  rationale: >-
    Only flows to the SSH port from the attacking host are brute-force traffic. The
    selector deliberately excludes everything else in the window.

topology:
  source_host: 192.168.50.10
  source_role: kali
  target_host: 192.168.50.20
  target_role: metasploitable2
  network: isolated host-only laboratory segment, no route to the internet

capture:
  interface: eth0
  source: cicflowmeter
  timestamp_column: timestamp
  timestamp_timezone: America/New_York
  timestamp_assumed_utc: false

model:
  name: xgb-baseline-cicids2017-v2
  version: "2.0"
  feature_version: cicids2017-78-v1
  artifact_file: xgb_baseline_cicids2017_v2.joblib

notes: >-
  No expected_label is declared: the tool differs from the one CICIDS2017 used, so a
  label-level attribution claim would not be defensible. Family-level attribution is
  scored, binary detection is primary. Required service: OpenSSH on 22.
