protocol_version: live-lab-v1
experiment_id: lab-generalization-v1
run_id: lab-v1-portscan-001
scenario_id: portscan
scenario_description: >-
  TCP port scan from Kali against the full Metasploitable2 port range. CICIDS2017
  generated its PortScan class with the same tool category against a comparable target,
  so the mapping to the PortScan family is defensible at both label and family level.

expected_binary_label: ATTACK
expected_family: PortScan
expected_label: PortScan
planned_duration_seconds: 600

ground_truth:
  mode: per_flow_selector
  unmatched_policy: UNLABELLED
  attack_selector:
    source_ip: 192.168.50.10
    destination_ip: 192.168.50.20
  rationale: >-
    Only flows from the scanning host to the target are scan traffic. Background flows
    inside the capture window are left UNLABELLED rather than assumed to be either
    class, so they enter no metric denominator.

topology:
  source_host: 192.168.50.10
  source_role: kali
  target_host: 192.168.50.20
  target_role: metasploitable2
  network: isolated host-only laboratory segment, no route to the internet

capture:
  interface: eth0
  source: cicflowmeter
  timestamp_column: timestamp
  timestamp_timezone: America/New_York
  timestamp_assumed_utc: false

model:
  name: xgb-baseline-cicids2017-v2
  version: "2.0"
  feature_version: cicids2017-78-v1
  artifact_file: xgb_baseline_cicids2017_v2.joblib

notes: >-
  A scan produces very many short flows, so this run reaches a usable denominator
  quickly. Required service on the target: any reachable TCP stack.
