protocol_version: live-lab-v1
experiment_id: lab-generalization-v1
run_id: lab-v1-benign-001
scenario_id: benign
scenario_description: >-
  Benign baseline. Ordinary client activity from Kali against the Metasploitable2
  services: ICMP echo, HTTP browsing of the Apache root and DVWA pages, an FTP login
  plus directory listing and file fetch, an interactive SSH session running a few
  shell commands, and DNS lookups. Runs before any attack scenario so the benign
  false-positive rate is measured on traffic never adjacent to an attack window.

expected_binary_label: BENIGN
planned_duration_seconds: 900

stopping_condition:
  min_valid_flows: 300
  min_distinct_services: 4
  note: >-
    The run is INVALID if it completes with fewer than min_valid_flows valid flows.
    The threshold is declared here before the run so it cannot be relaxed after
    seeing the result.

ground_truth:
  mode: run_level_uniform
  rationale: >-
    The testbed is isolated and no attack tool runs during this window, so every
    captured flow is benign by construction. This is the only run where a uniform
    run-level label is defensible.

topology:
  source_host: 192.168.50.10
  source_role: kali
  target_host: 192.168.50.20
  target_role: metasploitable2
  network: isolated host-only laboratory segment, no route to the internet

capture:
  interface: eth0
  source: cicflowmeter
  timestamp_column: timestamp
  timestamp_timezone: America/New_York
  timestamp_assumed_utc: false

model:
  name: xgb-baseline-cicids2017-v2
  version: "2.0"
  feature_version: cicids2017-78-v1
  artifact_file: xgb_baseline_cicids2017_v2.joblib

notes: >-
  Target sample: at least 300 valid flows across at least four distinct services, so the
  benign false-positive rate has a denominator worth reporting. Flows are never selected
  or discarded on the basis of what the model predicted.
