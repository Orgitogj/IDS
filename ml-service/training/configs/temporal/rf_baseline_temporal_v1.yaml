name: rf-baseline-cicids2017-temporal-v1
version: "temporal-1.0"
description: >-
  Random Forest pa balancim, ndarje kohore globale.

seed: 42

dataset:
  path: datasets/cicids2017_cleaned.parquet
  label_column: Label
  timestamp_column: Timestamp

features:
  reference: reports/training_feature_reference.json
  feature_set: cicids2017-78-v1

split:
  strategy: temporal_global
  test_size: 0.2

output:
  models_dir: models
  reports_dir: reports/temporal_evaluation/training
  artifact_name: rf_baseline_temporal_v1

balancing:
  enabled: false

model:
  type: random_forest
  params:
    n_estimators: 100
    n_jobs: -1
    class_weight: null
