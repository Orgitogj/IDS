name: xgb-smote-top10features-v2
version: '2.0'
description: 'RQ3: i njejti recept balancimi dhe i njejti split, mbi feature set-in
  top-10 te rirenditur nga modeli xgb-smote-cicids2017-v2. Renditja mesohet VETEM
  nga te dhenat e trajnimit. Kerkon qe ''python -m training.build_feature_ranking
  --write-reference'' te jete xhiruar me pare.'
seed: 42
dataset:
  path: datasets/cicids2017_cleaned.parquet
  label_column: Label
  timestamp_column: Timestamp
features:
  reference: reports/training_feature_reference.json
  feature_set: cicids2017-top10-v2
  columns: null
split:
  strategy: random
  test_size: 0.2
balancing:
  enabled: true
  benign_label: BENIGN
  benign_cap: 200000
  rare_class_min: 2000
  oversampler: smote
  smote_k_neighbors: 5
model:
  type: xgboost
  params:
    n_estimators: 100
    tree_method: hist
    eval_metric: mlogloss
    n_jobs: -1
output:
  models_dir: models
  reports_dir: reports/training
  artifact_name: xgb_smote_top10features_v2
