name: xgb-smote-cicids2017-v2
version: '2.0'
description: XGBoost mbi CICIDS2017, balancim i rikuperuar (BENIGN -> 200k, klasat
  e rralla -> 2k me SMOTE, vetem mbi train). Zevendeson recetën e humbur te notebook-ut
  me kod te riprodhueshem. Artefaktet v1 nuk mbishkruhen.
seed: 42
dataset:
  path: datasets/cicids2017_cleaned.parquet
  label_column: Label
  timestamp_column: Timestamp
features:
  reference: reports/training_feature_reference.json
  feature_set: cicids2017-78-v1
  columns: null
split:
  strategy: random
  test_size: 0.2
balancing:
  enabled: true
  benign_label: BENIGN
  benign_cap: 200000
  rare_class_min: 2000
  oversampler: smote
  smote_k_neighbors: 5
model:
  type: xgboost
  params:
    n_estimators: 100
    tree_method: hist
    eval_metric: mlogloss
    n_jobs: -1
output:
  models_dir: models
  reports_dir: reports/training
  artifact_name: xgb_smote_cicids2017_v2
