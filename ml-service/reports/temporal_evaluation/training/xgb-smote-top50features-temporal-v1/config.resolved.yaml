name: xgb-smote-top50features-temporal-v1
version: temporal-1.0
description: Varianti top-50 si krahasim deployment-i. Feature set-i eshte liste fikse
  e regjistruar; renditja u mesua nga modeli random-v2 mbi te dhenat e trajnimit.
seed: 42
dataset:
  path: datasets/cicids2017_cleaned.parquet
  label_column: Label
  timestamp_column: Timestamp
features:
  reference: reports/training_feature_reference.json
  feature_set: cicids2017-top50-v2
  columns: null
split:
  strategy: temporal_global
  test_size: 0.2
balancing:
  enabled: true
  benign_label: BENIGN
  benign_cap: 200000
  rare_class_min: 2000
  oversampler: smote
  smote_k_neighbors: 5
model:
  type: xgboost
  params:
    n_estimators: 100
    tree_method: hist
    eval_metric: mlogloss
    n_jobs: -1
output:
  models_dir: models
  reports_dir: reports/temporal_evaluation/training
  artifact_name: xgb_smote_top50_temporal_v1
