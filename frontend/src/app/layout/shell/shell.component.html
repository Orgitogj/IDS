<div class="flex h-screen bg-[var(--color-bg)]">
  <aside class="w-60 shrink-0 border-r border-[var(--color-border)] bg-[var(--color-surface)] flex flex-col">
    <div class="px-5 py-6">
      <h1 class="text-lg font-semibold tracking-tight text-white">IDS Dashboard</h1>
      <p class="text-xs text-[var(--color-text-muted)] mt-0.5">ML + LLM Explainability</p>
    </div>

    <nav class="flex-1 px-3 space-y-1">
      <a
        routerLink="/overview"
        routerLinkActive="bg-[var(--color-surface-elevated)] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)] hover:text-white transition-colors"
      >
        <span>Overview</span>
      </a>
      <a
        routerLink="/alarms"
        routerLinkActive="bg-[var(--color-surface-elevated)] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)] hover:text-white transition-colors"
      >
        <span>Alarms</span>
      </a>
      <a
        routerLink="/flows"
        routerLinkActive="bg-[var(--color-surface-elevated)] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)] hover:text-white transition-colors"
      >
        <span>Flows</span>
      </a>
      <a
        routerLink="/experiments"
        routerLinkActive="bg-[var(--color-surface-elevated)] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)] hover:text-white transition-colors"
      >
        <span>Experiments</span>
      </a>
      <a
        routerLink="/models"
        routerLinkActive="bg-[var(--color-surface-elevated)] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)] hover:text-white transition-colors"
      >
        <span>Models</span>
      </a>
      <a
        routerLink="/settings"
        routerLinkActive="bg-[var(--color-surface-elevated)] text-white"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium text-[var(--color-text-muted)] hover:bg-[var(--color-surface-elevated)] hover:text-white transition-colors"
      >
        <span>Settings</span>
      </a>
    </nav>

    <div class="px-5 py-4 border-t border-[var(--color-border)]">
      <div class="flex items-center gap-2 mb-2">
        <span
          class="w-2 h-2 rounded-full shrink-0"
          [class]="wsConnected() ? 'bg-[var(--color-low)]' : 'bg-[var(--color-text-muted)]'"
        ></span>
        <span class="text-xs text-[var(--color-text-muted)]">
          {{ wsConnected() ? 'Live - i lidhur' : 'Offline' }}
        </span>
      </div>
      @if (username(); as user) {
        <div class="flex items-center justify-between gap-2">
          <div class="min-w-0">
            <span class="block text-xs text-[var(--color-text)] truncate">{{ user }}</span>
            @if (role(); as r) {
              <span class="block text-[10px] uppercase tracking-wider text-[var(--color-text-muted)]">{{ r }}</span>
            }
          </div>
          <button
            (click)="logout()"
            class="text-[10px] px-2 py-0.5 rounded-md bg-[var(--color-surface-elevated)] text-[var(--color-text-muted)] hover:text-white shrink-0"
          >
            Dil
          </button>
        </div>
      }
    </div>
  </aside>

  <main class="flex-1 overflow-y-auto">
    <router-outlet></router-outlet>
  </main>

  <app-toast-container></app-toast-container>
</div>
