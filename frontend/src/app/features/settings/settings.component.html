<div class="p-6 max-w-3xl">
  <div class="mb-5">
    <h2 class="text-xl font-semibold text-white">Settings</h2>
    <p class="text-xs text-[var(--color-text-muted)] mt-0.5">Konfigurimi i sistemit</p>
  </div>

  <div class="bg-[var(--color-surface)] border border-[var(--color-border)] rounded-lg p-4 mb-4">
    <div class="flex items-center gap-2 mb-3">
      <span class="w-1 h-3.5 bg-[var(--color-primary)] rounded-full"></span>
      <h3 class="text-xs font-semibold text-white uppercase tracking-wide">Endpoints</h3>
    </div>
    <div class="space-y-2">
      @for (ep of endpoints; track ep.name) {
        <div class="flex items-center justify-between text-xs py-1.5 border-b border-[var(--color-border)] last:border-0">
          <span class="text-[var(--color-text-muted)]">{{ ep.name }}</span>
          <span class="text-white font-mono">{{ ep.url }}</span>
        </div>
      }
    </div>
  </div>

  <div class="bg-[var(--color-surface)] border border-[var(--color-border)] rounded-lg p-4">
    <div class="flex items-center gap-2 mb-3">
      <span class="w-1 h-3.5 bg-[var(--color-low)] rounded-full"></span>
      <h3 class="text-xs font-semibold text-white uppercase tracking-wide">Tech Stack</h3>
    </div>
    <div class="space-y-3">
      @for (item of stack; track item.layer) {
        <div>
          <p class="text-xs font-semibold text-white">{{ item.layer }}</p>
          <p class="text-[11px] text-[var(--color-text-muted)] mt-0.5">{{ item.tech }}</p>
        </div>
      }
    </div>
  </div>
</div>
