spring:
  application:
    name: idsml

  datasource:
    url: jdbc:postgresql://localhost:5433/IDS
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

logging:
  level:
    com.diploma.idsml: DEBUG
ids:
  security:
    jwt-secret: ${IDS_JWT_SECRET:}
    jwt-expiration-minutes: ${IDS_JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${IDS_REFRESH_EXPIRATION_DAYS:7}
    refresh-purge-cron: ${IDS_REFRESH_PURGE_CRON:0 30 3 * * *}
    cookie-secure: ${IDS_COOKIE_SECURE:false}
    allowed-origins: ${IDS_ALLOWED_ORIGINS:http://localhost:4200}
    login:
      max-user-attempts: ${IDS_LOGIN_MAX_USER_ATTEMPTS:5}
      user-lock-minutes: ${IDS_LOGIN_USER_LOCK_MINUTES:15}
      max-ip-attempts: ${IDS_LOGIN_MAX_IP_ATTEMPTS:20}
      ip-window-minutes: ${IDS_LOGIN_IP_WINDOW_MINUTES:5}
      purge-interval-ms: ${IDS_LOGIN_PURGE_INTERVAL_MS:300000}
  correlation:
    window-seconds: ${IDS_CORRELATION_WINDOW_SECONDS:120}
  bootstrap:
    admin-username: ${IDS_ADMIN_USERNAME:admin}
    admin-password: ${IDS_ADMIN_PASSWORD:}
    service-username: ${IDS_SERVICE_USERNAME:ml-service}
    service-password: ${IDS_SERVICE_PASSWORD:}
